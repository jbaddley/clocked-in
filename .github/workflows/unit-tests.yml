name: Unit tests

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  unit:
    name: Unit and import tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      - run: npm run test:import
