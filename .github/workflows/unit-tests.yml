name: Unit tests

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  unit:
    name: Unit and import tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://migration_test:migration_test@127.0.0.1:5432/migration_test?schema=public
      MIGRATION_TEST_DATABASE_URL: postgresql://migration_test:migration_test@127.0.0.1:5432/migration_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      - run: npm run test:import

      - run: npm run test:migrations
